name: Deploy research site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build research site
        run: npm run research:build

      - name: Show research-publisher diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          diagnostics_file="build-reports/build-diagnostics.json"
          if [ -f "$diagnostics_file" ]; then
            if command -v jq >/dev/null 2>&1; then
              jq '.diagnostics[] | select(.severity == "error")' "$diagnostics_file"
            else
              node -e '
              const fs = require("node:fs");
              const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const errors = (report.diagnostics || []).filter(
                diagnostic => diagnostic.severity === "error"
              );
              console.log(JSON.stringify(errors, null, 2));
              ' "$diagnostics_file"
            fi
          else
            echo "research-publisher did not produce $diagnostics_file"
          fi

      - name: Upload research-publisher diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: research-publisher-diagnostics
          path: build-reports/
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
